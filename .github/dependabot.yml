version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group into shared PRs
    groups:
      build:
        patterns:
          - '@babel/*'
          - 'babel-*'
          - 'tsc-alias'
          - 'typescript'

      lint:
        patterns:
          - '@typescript-eslint/*'
          - 'editorconfig-checker'
          - 'eslint'
          - 'eslint-*'
          - 'globals'
          - 'husky'
          - 'lint-staged'
          - 'neostandard'
          - 'prettier'
          - 'typescript-eslint'

      logging:
        patterns:
          - 'pino'
          - 'pino-*'

      tools:
        patterns:
          - 'jest'
          - 'jest-*'

      types:
        patterns:
          - '@types/*'

      hapi:
        patterns:
          - '@hapi/*'
          - 'hapi-*'

      runtime:
        patterns:
          - '@defra/hapi-tracing'

      dependencies:
        patterns:
          - '*'
        update-types:
          - patch

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    groups:
      actions:
        patterns:
          - '*'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
